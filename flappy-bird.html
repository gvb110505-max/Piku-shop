<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;
    background:#0d0d0d;
    display:flex;align-items:center;justify-content:center;
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
    overflow:hidden;
    touch-action:manipulation;
  }
  #wrap{
    position:relative;
    width:100%;
    max-width:480px;
    aspect-ratio:9/16;
    max-height:100vh;
    box-shadow:0 0 40px rgba(0,0,0,.6);
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    background:#70c5ce;
    cursor:pointer;
  }
  #back{
    position:absolute;
    top:12px;left:12px;
    z-index:10;
    color:#fff;
    background:rgba(0,0,0,.35);
    border:none;
    border-radius:20px;
    padding:8px 16px;
    font-size:12px;
    letter-spacing:1px;
    text-decoration:none;
    font-weight:700;
  }
</style>
</head>
<body>
<div id="wrap">
  <a id="back" href="index.html">← PIKU</a>
  <canvas id="game"></canvas>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // logical resolution (scaled to fill the responsive canvas)
  const W = 320, H = 480;
  canvas.width = W;
  canvas.height = H;

  const GRAVITY = 0.35;
  const FLAP = -6.2;
  const PIPE_GAP = 118;
  const PIPE_WIDTH = 52;
  const PIPE_SPACING = 165;
  const GROUND_H = 70;
  const PIPE_SPEED = 2.2;

  let bird, pipes, frame, score, best, state; // state: 'ready' | 'play' | 'over'

  best = Number(localStorage.getItem('flappy_best') || 0);

  function reset(){
    bird = { x: 70, y: H/2 - 60, w: 30, h: 24, vy: 0, rot: 0 };
    pipes = [];
    frame = 0;
    score = 0;
    state = 'ready';
  }
  reset();

  function addPipe(){
    const margin = 40;
    const top = margin + Math.random() * (H - GROUND_H - PIPE_GAP - margin*2);
    pipes.push({ x: W + 10, top: top, passed: false });
  }

  function flap(){
    if(state === 'ready'){
      state = 'play';
      bird.vy = FLAP;
    } else if(state === 'play'){
      bird.vy = FLAP;
    } else if(state === 'over'){
      reset();
    }
  }

  ['mousedown','touchstart'].forEach(evt=>{
    canvas.addEventListener(evt, function(e){
      e.preventDefault();
      flap();
    }, {passive:false});
  });
  window.addEventListener('keydown', function(e){
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      flap();
    }
  });

  function update(){
    if(state === 'play'){
      frame++;

      bird.vy += GRAVITY;
      bird.y += bird.vy;
      bird.rot = Math.max(-25, Math.min(90, bird.vy * 6));

      if(frame % Math.round(PIPE_SPACING / PIPE_SPEED) === 0){
        addPipe();
      }

      for(const p of pipes){
        p.x -= PIPE_SPEED;
        if(!p.passed && p.x + PIPE_WIDTH < bird.x){
          p.passed = true;
          score++;
        }
      }
      pipes = pipes.filter(p => p.x + PIPE_WIDTH > -10);

      // collisions
      if(bird.y + bird.h >= H - GROUND_H){
        bird.y = H - GROUND_H - bird.h;
        gameOver();
      }
      if(bird.y <= 0){
        bird.y = 0;
        bird.vy = 0;
      }
      for(const p of pipes){
        const inX = bird.x + bird.w > p.x && bird.x < p.x + PIPE_WIDTH;
        const hitTop = bird.y < p.top;
        const hitBottom = bird.y + bird.h > p.top + PIPE_GAP;
        if(inX && (hitTop || hitBottom)){
          gameOver();
        }
      }
    } else if(state === 'ready'){
      bird.y = H/2 - 60 + Math.sin(frame/12) * 6;
      frame++;
    }
  }

  function gameOver(){
    if(state !== 'over'){
      state = 'over';
      if(score > best){
        best = score;
        localStorage.setItem('flappy_best', String(best));
      }
    }
  }

  function drawBackground(){
    ctx.fillStyle = '#70c5ce';
    ctx.fillRect(0,0,W,H);

    // simple clouds
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    for(let i=0;i<3;i++){
      const cx = ((frame*0.3 + i*140) % (W+80)) - 40;
      const cy = 60 + i*40;
      ctx.beginPath();
      ctx.arc(cx, cy, 18, 0, Math.PI*2);
      ctx.arc(cx+18, cy+6, 14, 0, Math.PI*2);
      ctx.arc(cx-16, cy+8, 12, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawPipes(){
    for(const p of pipes){
      ctx.fillStyle = '#4ec04e';
      ctx.strokeStyle = '#2e8b2e';
      ctx.lineWidth = 3;
      // top pipe
      ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
      ctx.strokeRect(p.x, 0, PIPE_WIDTH, p.top);
      ctx.fillRect(p.x-4, p.top-24, PIPE_WIDTH+8, 24);
      ctx.strokeRect(p.x-4, p.top-24, PIPE_WIDTH+8, 24);
      // bottom pipe
      const by = p.top + PIPE_GAP;
      ctx.fillRect(p.x, by, PIPE_WIDTH, H - GROUND_H - by);
      ctx.strokeRect(p.x, by, PIPE_WIDTH, H - GROUND_H - by);
      ctx.fillRect(p.x-4, by, PIPE_WIDTH+8, 24);
      ctx.strokeRect(p.x-4, by, PIPE_WIDTH+8, 24);
    }
  }

  function drawGround(){
    ctx.fillStyle = '#ded895';
    ctx.fillRect(0, H-GROUND_H, W, GROUND_H);
    ctx.fillStyle = '#c8b866';
    const offset = (frame * PIPE_SPEED) % 24;
    for(let x = -offset; x < W; x += 24){
      ctx.fillRect(x, H-GROUND_H, 12, 10);
    }
    ctx.fillStyle = '#4ec04e';
    ctx.fillRect(0, H-GROUND_H, W, 6);
  }

  function drawBird(){
    ctx.save();
    ctx.translate(bird.x + bird.w/2, bird.y + bird.h/2);
    ctx.rotate(bird.rot * Math.PI/180);
    ctx.fillStyle = '#ffd23f';
    ctx.strokeStyle = '#c98f00';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, bird.w/2, bird.h/2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();
    // wing
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(-4, 2, 8, 5, 0, 0, Math.PI*2);
    ctx.fill();
    // eye
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(8, -4, 2.5, 0, Math.PI*2);
    ctx.fill();
    // beak
    ctx.fillStyle = '#ff8c00';
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(20, -2);
    ctx.lineTo(20, 4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawScore(){
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.textAlign = 'center';
    ctx.font = 'bold 36px Helvetica, Arial, sans-serif';
    ctx.strokeText(score, W/2, 60);
    ctx.fillText(score, W/2, 60);
  }

  function drawCenterText(lines){
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(0, H/2 - 70, W, 140);
    ctx.fillStyle = '#fff';
    lines.forEach((line, i)=>{
      ctx.font = i===0 ? 'bold 24px Helvetica, Arial, sans-serif' : '15px Helvetica, Arial, sans-serif';
      ctx.fillText(line, W/2, H/2 - 20 + i*30);
    });
  }

  function draw(){
    drawBackground();
    drawPipes();
    drawGround();
    drawBird();

    if(state === 'play'){
      drawScore();
    } else if(state === 'ready'){
      drawCenterText(['Flappy Bird', '탭하거나 스페이스바로 시작', 'Best: ' + best]);
    } else if(state === 'over'){
      drawCenterText(['Game Over', 'Score: ' + score + '   Best: ' + best, '탭하여 다시 시작']);
    }
  }

  function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
