<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Piku Arena</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 메인 메뉴 -->
  <section id="menu" class="screen">
    <div class="menu-card">
      <h1 class="logo">PIKU<span>ARENA</span></h1>
      <p class="tagline">3D 멀티 액션 · 프로토타입</p>

      <label class="name-field">
        <span>닉네임</span>
        <input id="nickname" maxlength="12" placeholder="플레이어" />
      </label>

      <div class="color-pick" id="colorPick" aria-label="캐릭터 색상"></div>

      <button id="btnSingle" class="btn primary">싱글 플레이</button>
      <button id="btnMulti" class="btn locked">
        멀티 플레이 <small>준비 중</small>
      </button>

      <p class="hint">WASD 이동 · Space 점프 · Shift 달리기 · 마우스 시점 · Esc 일시정지</p>
    </div>
  </section>

  <!-- 일시정지 -->
  <section id="pause" class="screen hidden">
    <div class="menu-card small">
      <h2>일시정지</h2>
      <button id="btnResume" class="btn primary">계속하기</button>
      <button id="btnRestart" class="btn">다시 시작</button>
      <button id="btnQuit" class="btn">메인 메뉴</button>
    </div>
  </section>

  <!-- 클리어 -->
  <section id="result" class="screen hidden">
    <div class="menu-card small">
      <h2>클리어!</h2>
      <p id="resultText" class="result-text"></p>
      <button id="btnAgain" class="btn primary">한 번 더</button>
      <button id="btnResultQuit" class="btn">메인 메뉴</button>
    </div>
  </section>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-box"><span class="label">코인</span><span id="hudCoins">0 / 0</span></div>
    <div class="hud-box"><span class="label">시간</span><span id="hudTime">0.0</span></div>
    <div id="clickToPlay" class="hidden">클릭해서 시점 고정</div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
