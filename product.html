<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIKU</title>
<style>
:root{
  --black:#0d0d0d;
  --white:#ffffff;
  --gray1:#e6e6e6;
  --gray2:#6b6b6b;
  --gray3:#3a3a3a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#ffffff !important;color:#0d0d0d !important;color-scheme:light only}
body{
  font-family:'Helvetica Neue',Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}

/* ---------- top strip / nav ---------- */
.strip{background:#0d0d0d !important;color:#fff !important;text-align:center;font-size:11px;letter-spacing:2px;padding:9px 12px}
nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96) !important;backdrop-filter:blur(12px);border-bottom:1px solid var(--gray1)}
.nav-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 24px}
.brand{font-size:22px;font-weight:800;letter-spacing:6px;text-decoration:none}
.back{font-size:12px;letter-spacing:2px;text-decoration:none;color:var(--gray3)}
.back:hover{color:var(--black)}

/* ---------- placeholder ---------- */
.ph{
  position:relative;background:#fff;outline:1px dashed #c9c9c9;outline-offset:-8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
}
.ph .icon{font-size:24px;font-weight:300}
.ph .hint{font-size:11px;letter-spacing:1px;opacity:.85}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ---------- detail ---------- */
main{max-width:1200px;margin:0 auto;padding:50px 24px 70px}
.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:start}
.gallery .main{aspect-ratio:3/4;border:1px solid var(--gray1)}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.thumbs button{aspect-ratio:1;border:1px solid var(--gray1);background:#fff;padding:0;cursor:pointer;position:relative;overflow:hidden}
.thumbs button.on{border-color:var(--black)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}

.info{position:sticky;top:100px}
.info .lbl{font-size:10px;letter-spacing:4px;color:var(--gray2);margin-bottom:18px;text-transform:uppercase}
.info h1{font-size:clamp(34px,5vw,52px);font-weight:800;letter-spacing:2px}
.info .tp{font-size:12px;color:var(--gray2);letter-spacing:2px;margin-top:6px;text-transform:uppercase}
.info .pr{font-size:22px;font-weight:600;margin:26px 0 30px}
.spec{border-top:1px solid var(--black)}
.spec div{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid var(--gray1);font-size:13px}
.spec dt{color:var(--gray2);letter-spacing:2px;font-size:11px;text-transform:uppercase}
.spec dd{text-align:right}
.desc{font-size:14px;line-height:2;color:var(--gray3);margin-top:26px;white-space:pre-line}
.buy{margin-top:34px;border:1px solid var(--black);padding:24px;text-align:center}
.buy .t{font-size:13px;font-weight:700;letter-spacing:1px;margin-bottom:6px}
.buy .s{font-size:12px;color:var(--gray2);margin-bottom:18px}
.buy a{
  display:block;background:#0d0d0d !important;color:#fff !important;text-decoration:none;
  padding:15px;font-size:12px;letter-spacing:3px;font-weight:700;transition:opacity .2s;
}
.buy a:hover{opacity:.85}

.pager{display:flex;justify-content:space-between;margin-top:60px;padding-top:22px;border-top:1px solid var(--gray1);font-size:12px;letter-spacing:2px}
.pager a{text-decoration:none;color:var(--gray3)}
.pager a:hover{color:var(--black)}

/* ---------- related ---------- */
.rel{margin-top:70px}
.rel h2{font-size:13px;font-weight:700;letter-spacing:4px;text-transform:uppercase;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--gray1);border:1px solid var(--gray1)}
.card{background:#fff;display:block;text-decoration:none}
.card .ph{aspect-ratio:3/4}
.card:hover .ph{outline-color:var(--black)}
.card .meta{padding:14px 14px 18px;display:flex;justify-content:space-between;align-items:center}
.card .no{font-size:13px;font-weight:700;letter-spacing:1px}
.card .tp{font-size:10px;color:var(--gray2);letter-spacing:2px;margin-top:3px;text-transform:uppercase}
.card .pr{font-size:13px;font-weight:600}

.notfound{text-align:center;padding:100px 0;color:var(--gray2);font-size:14px;line-height:2}
.notfound a{display:inline-block;margin-top:20px;background:#0d0d0d !important;color:#fff !important;text-decoration:none;padding:13px 36px;font-size:11px;letter-spacing:3px;font-weight:700}

footer{border-top:1px solid var(--gray1);text-align:center;padding:30px 16px;color:var(--gray2);font-size:11px;letter-spacing:1px}

@media(max-width:900px){
  .detail{grid-template-columns:1fr;gap:34px}
  .info{position:static}
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){
  main{padding:30px 16px 54px}
  .nav-in{padding:16px}
}
</style>
</head>
<body>

<div class="strip">구매는 인스타그램 프로필에서 · <span id="stripId"></span></div>

<nav>
  <div class="nav-in">
    <a href="index.html" class="brand">PIKU</a>
    <a href="index.html#shop" class="back">← SHOP</a>
  </div>
</nav>

<main id="main"></main>

<footer>© 2026 PIKU</footer>

<script src="products.js"></script>
<script>
const main = document.getElementById("main");
document.getElementById("stripId").textContent = INSTA_LABEL;

const no = Number(new URLSearchParams(location.search).get("no"));
const idx = products.findIndex(p => p.no === no);
const p = products[idx];

const phHtml = (src, alt) => `
  ${src ? `<img src="${src}" alt="${alt}">` : ""}
  <span class="icon">＋</span>
  <span class="hint">사진 넣기</span>`;

if (!p) {
  main.innerHTML = `
    <div class="notfound">
      상품을 찾을 수 없어요.<br>
      <a href="index.html#shop">SHOP으로 돌아가기</a>
    </div>`;
} else {
  document.title = noStr(p.no) + " — PIKU";
  const photos = [p.img, ...(p.imgs || [])].filter(Boolean);
  const prev = products[idx - 1], next = products[idx + 1];
  const related = products.filter(r => r.season === p.season && r.no !== p.no).slice(0, 4);

  main.innerHTML = `
    <div class="detail">
      <div class="gallery">
        <div class="ph main" id="mainPh">${phHtml(photos[0], noStr(p.no))}</div>
        ${photos.length > 1 ? `<div class="thumbs">${photos.map((src, i) =>
          `<button class="${i ? "" : "on"}" onclick="showPhoto(${i})"><img src="${src}" alt=""></button>`).join("")}</div>` : ""}
      </div>
      <div class="info">
        <div class="lbl">${EN[p.season]} COLLECTION</div>
        <h1>${noStr(p.no)}</h1>
        <div class="tp">${p.type}</div>
        <div class="pr">${won(p.price)}</div>
        <dl class="spec">
          <div><dt>Size</dt><dd>${p.sizes || "FREE"}</dd></div>
          ${p.fabric ? `<div><dt>Fabric</dt><dd>${p.fabric}</dd></div>` : ""}
          <div><dt>Season</dt><dd>${KO[p.season]}</dd></div>
        </dl>
        ${p.desc ? `<p class="desc">${p.desc}</p>` : ""}
        <div class="buy">
          <div class="t">구매는 인스타그램 프로필에서</div>
          <div class="s">${INSTA_URL ? INSTA_LABEL + " 프로필에서 바로 구매하실 수 있어요." : "인스타그램 계정 준비 중이에요."}</div>
          ${INSTA_URL ? `<a href="${INSTA_URL}" target="_blank" rel="noopener">인스타그램에서 구매하기</a>` : ""}
        </div>
      </div>
    </div>

    <div class="pager">
      ${prev ? `<a href="${detailUrl(prev.no)}">← ${noStr(prev.no)}</a>` : "<span></span>"}
      ${next ? `<a href="${detailUrl(next.no)}">${noStr(next.no)} →</a>` : "<span></span>"}
    </div>

    ${related.length ? `
    <section class="rel">
      <h2>More ${EN[p.season]}</h2>
      <div class="grid">${related.map(r => `
        <a class="card" href="${detailUrl(r.no)}">
          <div class="ph">${phHtml(r.img, noStr(r.no))}</div>
          <div class="meta">
            <div><div class="no">${noStr(r.no)}</div><div class="tp">${r.type}</div></div>
            <div class="pr">${won(r.price)}</div>
          </div>
        </a>`).join("")}
      </div>
    </section>` : ""}`;

  window.showPhoto = i => {
    document.getElementById("mainPh").innerHTML = phHtml(photos[i], noStr(p.no));
    document.querySelectorAll(".thumbs button").forEach((b, j) => b.classList.toggle("on", i === j));
  };
}
</script>
</body>
</html>
