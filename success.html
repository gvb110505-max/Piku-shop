<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIKU — 결제 완료</title>
<style>
html,body{background:#fff !important;color:#0d0d0d !important}
body{font-family:'Helvetica Neue',Helvetica,Arial,'Apple SD Gothic Neo',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{text-align:center;padding:40px;max-width:420px}
h1{font-size:20px;letter-spacing:4px;font-weight:800;margin-bottom:18px}
p{font-size:13px;color:#555;line-height:1.8;margin:6px 0}
.oid{font-size:11px;color:#999;margin-top:14px;word-break:break-all}
a{display:inline-block;margin-top:28px;background:#0d0d0d;color:#fff;text-decoration:none;padding:13px 36px;font-size:11px;letter-spacing:3px;font-weight:700}
.err{color:#c0392b}
</style>
</head>
<body>
<div class="box" id="box">
  <h1>결제 확인 중…</h1>
  <p>잠시만 기다려 주세요.</p>
</div>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const box = document.getElementById("box");
  try {
    const res = await fetch("/api/confirm", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        paymentKey: q.get("paymentKey"),
        orderId: q.get("orderId"),
        amount: Number(q.get("amount")),
        items: q.get("items"),
      })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.removeItem("piku_cart");
      box.innerHTML = `
        <h1>결제 완료</h1>
        <p>주문이 정상 처리됐습니다.</p>
        <p>${data.orderName || ""} · ${Number(data.totalAmount||0).toLocaleString("ko-KR")}원</p>
        <div class="oid">주문번호 ${data.orderId || q.get("orderId")}</div>
        <a href="/">돌아가기</a>`;
    } else {
      throw new Error(data.message || "승인 실패");
    }
  } catch (e) {
    box.innerHTML = `
      <h1 class="err">결제 승인 실패</h1>
      <p>${e.message}</p>
      <p>카드 승인은 자동 취소됩니다.</p>
      <a href="/">돌아가기</a>`;
  }
})();
</script>
</body>
</html>
